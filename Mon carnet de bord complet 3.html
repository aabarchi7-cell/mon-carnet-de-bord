<h1>Mon carnet de bord</h1>
<div class="subtitle">Version blanche - Photo partout + Modifier/Supprimer</div>

<div class="card section open" id="sec-glucose">
<div class="section-head" onclick="toggleSec('sec-glucose')">🩸 Glycemie <span>▼</span></div>
<div class="section-body">
<button onclick="toggleForm('glucoseForm')">+ Ajouter</button>
<form id="glucoseForm" style="display:none" onsubmit="addGlucose(event)">
<input type="hidden" id="gEditIndex" value="-1">
<input id="gValue" type="number" placeholder="Valeur mg/dL" required>
<select id="gMoment"><option>A jeun</option><option>Avant repas</option><option selected>2 h apres repas</option><option>Autre</option></select>
<input id="gDate" type="date" required><input id="gTime" type="time">

<textarea id="gNote" placeholder="Remarque"></textarea>
<label>📷 Photo</label>
<input type="file" accept="image/*" id="gPhotoInput" onchange="previewPhoto(this,'g')">
<img id="gPreview" class="preview"><div id="gOcrStatus" class="meta"></div>
<div style="display:flex;gap:6px;margin:6px 0"><button type="button" onclick="readPhoto()">🔎 Relire</button><button type="button" onclick="manualPhoto()">✍️ Saisir</button><button type="button" onclick="clearPhoto('g')">❌ Sans photo</button></div>
<button class="primary" type="submit" id="gSubmitBtn">Enregistrer</button>
<button type="button" onclick="cancelEdit('glucoseForm')">Annuler</button>
</form>
<div id="glucoseList"></div>
<canvas id="glucoseChart" width="760" height="220"></canvas>
</div>
</div>

<div class="card section" id="sec-food">

</form>
<div id="foodList"></div>
</div>
</div>

function previewPhoto(input, key){
  const file=input.files&&input.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=function(e){
    const img=new Image();
    img.onload=function(){
      const canvas=document.createElement('canvas');
      let w=img.width, h=img.height; const maxSide=500;
      if(w>maxSide || h>maxSide){ if(w>h){ h=Math.round(h*maxSide/w); w=maxSide; } else { w=Math.round(w*maxSide/h); h=maxSide; } }
      canvas.width=w; canvas.height=h; const ctx=canvas.getContext('2d'); ctx.drawImage(img,0,0,w,h);
      photos[key]=canvas.toDataURL('image/jpeg',0.45);
      const preview=document.getElementById(key+'Preview'); if(preview){ preview.src=photos[key]; preview.style.display='block'; }
      if(key==='g'){ document.getElementById('gOcrStatus').textContent='Photo '+Math.round(photos[key].length/1024)+' Ko'; }
    }; img.src=e.target.result;
  }; reader.readAsDataURL(file);
}

async function tryOcr(){ 
  const status=document.getElementById('gOcrStatus'); const preview=document.getElementById('gPreview'); if(!preview.src) return;
  status.textContent='Lecture...';
  try{ 
    const canvas=document.createElement('canvas'); canvas.width=preview.naturalWidth; canvas.height=preview.naturalHeight; const ctx=canvas.getContext('2d'); ctx.drawImage(preview,0,0);
    const res=await Tesseract.recognize(canvas, 'eng', {tessedit_char_whitelist:'0123456789', tessedit_pageseg_mode:'8'});
    const txt=res.data.text||''; const nums=txt.match(/\d{2,3}/g); let best=null; if(nums){ for(let n of nums){ const v=parseInt(n); if(v>=20 && v<=600){ best=v; break; } } }
    if(best){ document.getElementById('gValue').value=best; status.textContent='✅ '+best+' detecte'; } else { status.textContent='Non trouve: '+txt.slice(0,20); }
  }catch(e){ status.textContent='OCR echoue'; }
}

function drawChart(){
