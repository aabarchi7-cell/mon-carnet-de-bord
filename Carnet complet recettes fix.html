<!DOCTYPE html>
<html lang="fr">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Carnet complet recettes fix</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--acc:#6c5ce7;--ok:#00b894;--bad:#d63031;--text:#2d3436;--blue:#eef2ff}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--text)}
header{padding:14px 16px;background:var(--card);position:sticky;top:0;z-index:10;box-shadow:0 2px 8px rgba(0,0,0,.06);display:flex;justify-content:space-between;align-items:center}
h1{font-size:18px;margin:0}
.btn{border:0;border-radius:10px;padding:8px 12px;background:var(--acc);color:#fff;font-weight:600;text-decoration:none;display:inline-block}
.btn-sm{padding:6px 10px;font-size:12px}
.btn-ghost{background:#eee;color:#333}
.btn-danger{background:var(--bad)}
.card{background:var(--card);margin:12px;border-radius:14px;padding:12px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
input,select,textarea{width:100%;padding:10px;border-radius:10px;border:1px solid #ddd;font-size:15px;box-sizing:border-box}
label{font-size:12px;font-weight:600;margin:6px 0 2px;display:block}
.item{border:1px solid #eee;border-radius:12px;padding:10px;margin:8px 0;display:flex;justify-content:space-between;gap:8px;align-items:center}
img.thumb{width:60px;height:45px;object-fit:cover;border-radius:6px;border:1px solid #eee}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;background:#dfe6e9}
canvas{width:100%!important;height:160px!important;background:#fff;border-radius:10px}
details summary{cursor:pointer;font-weight:700;padding:8px 0;font-size:15px}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#2d3436;color:#fff;padding:10px 14px;border-radius:20px;display:none;z-index:99;max-width:90%;text-align:center}
.shortcut-mini{display:flex;align-items:center;gap:8px;background:#ede9fe;border:1px solid #ddd6fe;border-radius:10px;padding:6px 10px;margin-bottom:8px;font-size:12px}
.alert-active{display:flex;justify-content:space-between;align-items:center;background:#e6fffa;border:1px solid #81e6d5;border-radius:10px;padding:8px 10px;margin:8px 0;font-size:12px}
.form-box{border:1px dashed #ccc;padding:10px;border-radius:12px;margin-top:8px}
.sleep-card{background:#fff;border:1px solid #dbeafe;border-radius:14px;padding:12px;margin:10px 0;box-shadow:0 1px 4px rgba(0,0,0,.04);font-size:13px}
.sleep-block{background:var(--blue);border-radius:10px;padding:8px 10px;margin:8px 0}
</style>
</head>
<body>
<header><h1>📒 Mon carnet complet</h1><div class="row"><button class="btn btn-sm" onclick="restoreRecipes()">♻️ Restaurer recettes</button><button class="btn btn-sm btn-ghost" onclick="exportData()">Exporter</button></div></header>
<div id="toast"></div>
<main style="max-width:720px;margin:auto;padding-bottom:80px">

<div class="card"><details id="det-gly"><summary>🩸 Glycémie <span id="g-count" class="badge">0</span> <span id="alert-ind" class="badge" style="display:none;background:#00b894;color:#fff">⏰ alerte</span></summary>
<div class="shortcut-mini"><b>📲 Photo →</b><a class="btn btn-sm" style="padding:4px 10px;font-size:11px" href="shortcuts://run-shortcut?name=Test%20glyc%C3%A9mie%20photo">▶️ Test glycémie photo</a></div>
<div id="alert-pending"></div><div id="alert-setup" style="display:none;background:#fff7e6;border:1px solid #ffe58f;border-radius:10px;padding:8px;margin:8px 0;font-size:12px">⏰ Rappel 2h ?<div class="row" style="margin-top:6px"><button class="btn btn-sm" style="background:#00b894" onclick="activateAlert(120)">Oui 2h</button><button class="btn btn-sm btn-ghost" onclick="activateAlert(60)">1h</button><button class="btn btn-sm btn-ghost" onclick="document.getElementById('alert-setup').style.display='none'">Non</button></div></div>
<canvas id="gChart"></canvas>
<div class="form-box"><label>Valeur *</label><input id="gVal" type="number" inputmode="numeric"><div class="row"><div style="flex:1"><label>Moment</label><select id="gMoment" onchange="onMomentChange()"><option value="à jeun">À jeun</option><option value="avant repas">Avant repas</option><option value="après repas">2h après repas</option><option value="coucher">Coucher</option></select></div><div style="flex:1"><label>Date</label><input id="gDate" type="date"></div><div style="flex:1"><label>Heure</label><input id="gTime" type="time"></div></div><label>Photo lecteur</label><input id="gPhoto" type="file" accept="image/*" capture="environment"><div id="gPreview"></div><div class="row"><button class="btn btn-sm btn-ghost" onclick="clearPhoto('g')">❌ Sans photo</button><label style="font-weight:400;display:flex;align-items:center;gap:4px"><input type="checkbox" id="chkAlert" checked style="width:auto"> Alerte 2h</label></div><label>Note</label><input id="gNote"><div class="row" style="margin-top:8px"><button class="btn" onclick="saveGly()">Enregistrer</button><button class="btn btn-ghost" onclick="cancelEdit()">Annuler</button></div></div><div id="gList"></div></details></div>

<div class="card"><details open id="det-food"><summary>🍽️ Alimentation & recettes <span id="f-count" class="badge">0</span></summary>
<div class="form-box"><label>Titre *</label><input id="fTitle"><label>Type</label><select id="fType" onchange="foodTypeChanged()"><option value="repas">Repas</option><option value="recette">Recette</option></select><div id="fRecetteFields"><label>Ingrédients</label><textarea id="fIng" rows="2"></textarea><label>Étapes</label><textarea id="fStep" rows="2"></textarea><label>Photo</label><input id="fPhoto" type="file" accept="image/*"><div id="fPreview"></div></div><div class="row" style="margin-top:8px"><button class="btn" onclick="saveFood()">Enregistrer</button><button class="btn btn-ghost" onclick="cancelEdit()">Annuler</button></div></div><div id="fList"></div></details></div>

<div class="card"><details id="det-tens"><summary>❤️ Tension <span id="t-count" class="badge">0</span></summary><div class="form-box"><div class="row"><div style="flex:1"><label>SYS/DIA</label><input id="tVal"></div><div style="flex:1"><label>Date</label><input id="tDate" type="date"></div><div style="flex:1"><label>Heure</label><input id="tTime" type="time"></div></div><label>Photo tensiomètre</label><input id="tPhoto" type="file" accept="image/*" capture="environment"><div id="tPreview"></div><div class="row"><button class="btn btn-sm btn-ghost" onclick="clearPhoto('t')">❌ Sans photo</button></div><label>Note</label><input id="tNote"><div class="row" style="margin-top:8px"><button class="btn" onclick="saveTension()">Enregistrer</button><button class="btn btn-ghost" onclick="cancelEdit()">Annuler</button></div></div><div id="tList"></div></details></div>

<div class="card"><details id="det-meds"><summary>💊 Médicaments <span id="m-count" class="badge">0</span></summary><div class="form-box"><div class="row"><div style="flex:1"><label>Nom/dose</label><input id="mVal"></div><div style="flex:1"><label>Date</label><input id="mDate" type="date"></div></div><label>Photo boîte</label><input id="mPhoto" type="file" accept="image/*"><div id="mPreview"></div><div class="row" style="margin-top:8px"><button class="btn" onclick="saveMeds()">Enregistrer</button><button class="btn btn-ghost" onclick="cancelEdit()">Annuler</button></div></div><div id="mList"></div></details></div>

<div class="card"><details id="det-analyses"><summary>🧪 Analyses <span id="a-count" class="badge">0</span></summary><div class="form-box"><div class="row"><div style="flex:1"><label>Type</label><input id="aVal"></div><div style="flex:1"><label>Résultat</label><input id="aResult"></div><div style="flex:1"><label>Date</label><input id="aDate" type="date"></div></div><label>Photo labo</label><input id="aPhoto" type="file" accept="image/*"><div id="aPreview"></div><div class="row" style="margin-top:8px"><button class="btn" onclick="saveAnalyses()">Enregistrer</button><button class="btn btn-ghost" onclick="cancelEdit()">Annuler</button></div></div><div id="aList"></div></details></div>

<div class="card"><details open id="det-sommeil"><summary>😴 Sommeil HUAWEI <span id="sl-count" class="badge">0</span></summary>
<div class="form-box" style="background:#f8fafc"><div class="row"><div style="flex:1"><label>Date</label><input id="slDate" type="date"></div><div style="flex:1"><label>Total</label><input id="slTotal" placeholder="7h13"></div><div style="flex:1"><label>Qualité</label><select id="slQual"><option>Bonne</option><option>Moyenne</option><option>Mauvaise</option><option>Excellente</option></select></div></div><div class="row"><div style="flex:1"><label>S1 début</label><input id="slS1D" type="time"></div><div style="flex:1"><label>fin</label><input id="slS1F" type="time"></div><div style="flex:1"><label>durée</label><input id="slS1Dur"></div></div><div class="row"><div style="flex:1"><label>Éveil</label><input id="slEveil"></div><div style="flex:1"><label>Paradoxal</label><input id="slPara"></div><div style="flex:1"><label>Lent</label><input id="slLent"></div><div style="flex:1"><label>Profond</label><input id="slProf"></div></div><div class="row"><div style="flex:1"><label>S2 début</label><input id="slS2D" type="time"></div><div style="flex:1"><label>fin</label><input id="slS2F" type="time"></div><div style="flex:1"><label>durée</label><input id="slS2Dur"></div></div><label>Observations</label><input id="slObs"><label>Source</label><input id="slSource" value="HUAWEI Health"><div class="row" style="margin-top:8px"><button class="btn" onclick="saveSommeil()">Enregistrer nuit</button><button class="btn btn-ghost" onclick="cancelEdit()">Annuler</button></div></div><div id="slList"></div></details></div>

<div class="card"><details><summary>🏃 Sport <span id="s-count" class="badge">0</span></summary><div class="form-box"><div class="row"><input id="sVal" style="flex:1"><button class="btn btn-sm" onclick="saveItem('sport','sVal')">OK</button></div></div><div id="sList"></div></details></div>
<div class="card"><details><summary>📝 Notes <span id="n-count" class="badge">0</span></summary><div class="form-box"><div class="row"><input id="nVal" style="flex:1"><button class="btn btn-sm" onclick="saveItem('notes','nVal')">OK</button></div></div><div id="nList"></div></details></div>

</main>
<script>
const KEY='carnet_v12_final';
const ALERT_KEY='carnet_alerts';
const DEFAULT_RECIPES=[
 {title:"Harira",type:"recette",ing:"Tomates, pois chiches, lentilles, coriandre",steps:"Mixer tomates, cuire 45min",photo:null,ts:1},
 {title:"Tajine poulet citron",type:"recette",ing:"Poulet, citron confit, olives",steps:"Faire revenir, 1h",photo:null,ts:2},
 {title:"Couscous légumes",type:"recette",ing:"Semoule, carottes, courgettes",steps:"Vapeur",photo:null,ts:3},
 {title:"Chorba",type:"recette",ing:"Viande, vermicelles, tomates",steps:"Cuire",photo:null,ts:4},
 {title:"Salade marocaine",type:"recette",ing:"Tomates, concombres",steps:"Couper",photo:null,ts:5},
 {title:"Briouates",type:"recette",ing:"Brick, amandes, miel",steps:"Frire",photo:null,ts:6},
 {title:"Loubia",type:"recette",ing:"Haricots blancs, tomates",steps:"Cuire",photo:null,ts:7},
 {title:"Rfissa",type:"recette",ing:"Msemen, poulet, lentilles",steps:"Cuire",photo:null,ts:8},
 {title:"Tajine kefta",type:"recette",ing:"Kefta, tomates, oeufs",steps:"Boulettes",photo:null,ts:9},
 {title:"Seffa",type:"recette",ing:"Vermicelles, amandes",steps:"Vapeur",photo:null,ts:10},
 {title:"Pastilla",type:"recette",ing:"Feuilles, poulet, amandes",steps:"Monter",photo:null,ts:11},
 {title:"Tanjia",type:"recette",ing:"Viande, cumin",steps:"4h",photo:null,ts:12},
 {title:"Msemen",type:"recette",ing:"Farine, semoule",steps:"Pétrir",photo:null,ts:13},
 {title:"Baghrir",type:"recette",ing:"Semoule, levure",steps:"Buller",photo:null,ts:14}
];
let stored=JSON.parse(localStorage.getItem(KEY)||'null');
let data;
if(!stored){
 data={glucose:[],foods:JSON.parse(JSON.stringify(DEFAULT_RECIPES)),tension:[],meds:[],analyses:[],sommeil:[{date:"2026-09-20",total:"7h13",s1d:"01:22",s1f:"04:22",s1dur:"3h49",eveil:"11 min",para:"41 min",lent:"2h44",prof:"24 min",s2d:"06:00",s2f:"09:24",s2dur:"3h24",qual:"Bonne",obs:"Sensation reposée",source:"HUAWEI Health - 20/09/2026 09:30",ts:Date.now()}],sport:[],notes:[]};
}else{
 data=stored;
 // FIX RECETTES : si vide, on restaure
 if(!data.foods || data.foods.length===0){data.foods=JSON.parse(JSON.stringify(DEFAULT_RECIPES));}
 // FIX pour anciennes clés
 if(!data.tension) data.tension=[];
 if(!data.meds) data.meds=[];
 if(!data.analyses) data.analyses=[];
 if(!data.sommeil) data.sommeil=[];
 if(!data.sport) data.sport=[];
 if(!data.notes) data.notes=[];
}
let alerts=JSON.parse(localStorage.getItem(ALERT_KEY)||'[]');
let edit={type:null,index:null};
let photos={g:null,t:null,m:null,a:null,f:null};
function save(){localStorage.setItem(KEY,JSON.stringify(data));render();}
function saveAlerts(){localStorage.setItem(ALERT_KEY,JSON.stringify(alerts));renderAlerts();}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.style.display='block';setTimeout(()=>el.style.display='none',3000);}
function todayStr(){return new Date().toISOString().slice(0,10);}function nowStr(){return new Date().toTimeString().slice(0,5);}
['gDate','tDate','mDate','aDate','slDate'].forEach(id=>{const e=document.getElementById(id);if(e)e.value=todayStr();});
['gTime','tTime'].forEach(id=>{const e=document.getElementById(id);if(e)e.value=nowStr();});
function compress(file,cb){const r=new FileReader();r.onload=e=>{const img=new Image();img.onload=()=>{let w=img.width,h=img.height;const max=500;if(w>max||h>max){const s=Math.min(max/w,max/h);w*=s;h*=s;}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);cb(c.toDataURL('image/jpeg',0.4));};img.src=e.target.result;};r.readAsDataURL(file);}
function setupPhoto(id,key,prev){const el=document.getElementById(id);if(!el)return;el.addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;compress(f,url=>{photos[key]=url;document.getElementById(prev).innerHTML=`<img src="${url}" style="width:90px;height:60px;object-fit:cover;border-radius:6px">`});});}
setupPhoto('gPhoto','g','gPreview');setupPhoto('tPhoto','t','tPreview');setupPhoto('mPhoto','m','mPreview');setupPhoto('aPhoto','a','aPreview');setupPhoto('fPhoto','f','fPreview');
function clearPhoto(k){photos[k]=null;const p=document.getElementById(k+'Preview');if(p)p.innerHTML='';const inp=document.getElementById(k+'Photo');if(inp)inp.value='';}
function restoreRecipes(){if(confirm("Restaurer les 14 recettes de base ? Tes recettes ajoutées resteront.")){const existingTitles=new Set(data.foods.map(f=>f.title));DEFAULT_RECIPES.forEach(r=>{if(!existingTitles.has(r.title)) data.foods.push(JSON.parse(JSON.stringify(r)));});save();toast("14 recettes restaurées");}}
function onMomentChange(){document.getElementById('chkAlert').checked=(document.getElementById('gMoment').value==='avant repas');}
function saveGly(){let v=parseInt(document.getElementById('gVal').value);if(!v){toast("Entre valeur");return;}const o={v:v,moment:document.getElementById('gMoment').value,date:document.getElementById('gDate').value||todayStr(),time:document.getElementById('gTime').value||nowStr(),note:document.getElementById('gNote').value,photo:photos.g,ts:Date.now()};if(edit.type==='glucose'){data.glucose[edit.index]=o;edit={type:null,index:null};}else data.glucose.push(o);document.getElementById('gVal').value='';document.getElementById('gNote').value='';clearPhoto('g');save();if(document.getElementById('chkAlert').checked && (o.moment==='avant repas'||o.moment==='à jeun')){document.getElementById('alert-setup').style.display='block';}else toast(`Glycémie ${v} enregistrée`);}
function saveFood(){const t=document.getElementById('fTitle').value.trim();if(!t){toast("Titre requis");return;}const o={title:t,type:document.getElementById('fType').value,ing:document.getElementById('fIng').value,steps:document.getElementById('fStep').value,photo:photos.f,ts:Date.now()};if(edit.type==='foods'){data.foods[edit.index]=o;edit={type:null,index:null};}else data.foods.push(o);document.getElementById('fTitle').value='';clearPhoto('f');save();toast("Enregistré");}
function saveTension(){const v=document.getElementById('tVal').value.trim();if(!v)return;const o={v:v,date:document.getElementById('tDate').value||todayStr(),time:document.getElementById('tTime').value||nowStr(),note:document.getElementById('tNote').value,photo:photos.t,ts:Date.now()};if(edit.type==='tension'){data.tension[edit.index]=o;edit={type:null,index:null};}else data.tension.push(o);document.getElementById('tVal').value='';clearPhoto('t');save();}
function saveMeds(){const v=document.getElementById('mVal').value.trim();if(!v)return;const o={v:v,date:document.getElementById('mDate').value||todayStr(),photo:photos.m,ts:Date.now()};if(edit.type==='meds'){data.meds[edit.index]=o;edit={type:null,index:null};}else data.meds.push(o);document.getElementById('mVal').value='';clearPhoto('m');save();}
function saveAnalyses(){const v=document.getElementById('aVal').value.trim();if(!v)return;const o={v:v,result:document.getElementById('aResult').value,date:document.getElementById('aDate').value||todayStr(),photo:photos.a,ts:Date.now()};if(edit.type==='analyses'){data.analyses[edit.index]=o;edit={type:null,index:null};}else data.analyses.push(o);document.getElementById('aVal').value='';document.getElementById('aResult').value='';clearPhoto('a');save();}
function saveSommeil(){const o={date:document.getElementById('slDate').value||todayStr(),total:document.getElementById('slTotal').value,s1d:document.getElementById('slS1D').value,s1f:document.getElementById('slS1F').value,s1dur:document.getElementById('slS1Dur').value,eveil:document.getElementById('slEveil').value,para:document.getElementById('slPara').value,lent:document.getElementById('slLent').value,prof:document.getElementById('slProf').value,s2d:document.getElementById('slS2D').value,s2f:document.getElementById('slS2F').value,s2dur:document.getElementById('slS2Dur').value,qual:document.getElementById('slQual')?.value||'Bonne',obs:document.getElementById('slObs').value,source:document.getElementById('slSource').value,ts:Date.now()};if(edit.type==='sommeil'){data.sommeil[edit.index]=o;edit={type:null,index:null};}else data.sommeil.push(o);save();toast("Nuit enregistrée");}
function saveItem(cat,inputId){const val=document.getElementById(inputId).value.trim();if(!val)return;const o={v:val,date:todayStr(),ts:Date.now()};if(edit.type===cat){data[cat][edit.index]=o;edit={type:null,index:null};}else data[cat].push(o);document.getElementById(inputId).value='';save();}
function foodTypeChanged(){const el=document.getElementById('fRecetteFields');if(el)el.style.display=document.getElementById('fType').value==='recette'?'block':'none';}
function editItem(cat,i){edit={type:cat,index:i};const o=data[cat][i];if(cat==='glucose'){document.getElementById('gVal').value=o.v;document.getElementById('det-gly').open=true;}else if(cat==='foods'){document.getElementById('fTitle').value=o.title;document.getElementById('fType').value=o.type;document.getElementById('fIng').value=o.ing||'';document.getElementById('fStep').value=o.steps||'';foodTypeChanged();document.getElementById('det-food').open=true;}else if(cat==='sommeil'){document.getElementById('slDate').value=o.date;document.getElementById('slTotal').value=o.total;document.getElementById('det-sommeil').open=true;}else{const map={tension:'tVal',meds:'mVal',analyses:'aVal',sport:'sVal',notes:'nVal'};if(map[cat])document.getElementById(map[cat]).value=o.v;}}
function delItem(cat,i){if(!confirm("Supprimer ?"))return;data[cat].splice(i,1);edit={type:null,index:null};save();toast("Supprimé");}
function cancelEdit(){edit={type:null,index:null};}
function activateAlert(mins){const due=Date.now()+mins*60000;const id='al_'+Date.now();alerts.push({id:id,due:due,label:`Reprendre glycémie`,mins:mins});saveAlerts();document.getElementById('alert-setup').style.display='none';toast(`⏰ Alerte ${mins}min`);if('Notification' in window && Notification.permission!=='granted')Notification.requestPermission();setTimeout(()=>triggerAlert(id),mins*60000);}
function triggerAlert(id){const a=alerts.find(x=>x.id===id);if(!a)return;if('Notification' in window && Notification.permission==='granted'){new Notification('🩸 Glycémie 2h', {body:'Reprends ta mesure !'});}alert('⏰ Reprends ta glycémie !');alerts=alerts.filter(x=>x.id!==id);saveAlerts();}
function renderAlerts(){const c=document.getElementById('alert-pending');if(!c)return;if(alerts.length===0){c.innerHTML='';document.getElementById('alert-ind').style.display='none';return;}document.getElementById('alert-ind').style.display='inline-block';c.innerHTML=alerts.map(a=>{const rem=Math.max(0,Math.ceil((a.due-Date.now())/60000));return `<div class="alert-active"><span>⏰ ${a.label} dans ${rem}min</span><button class="btn btn-sm btn-ghost" onclick="cancelAlert('${a.id}')">Annuler</button></div>`}).join('');}
function cancelAlert(id){alerts=alerts.filter(x=>x.id!==id);saveAlerts();}
function render(){
 document.getElementById('g-count').textContent=data.glucose.length;
 document.getElementById('f-count').textContent=data.foods.length;
 document.getElementById('t-count').textContent=data.tension.length;
 document.getElementById('m-count').textContent=data.meds.length;
 document.getElementById('a-count').textContent=data.analyses.length;
 document.getElementById('sl-count').textContent=(data.sommeil||[]).length;
 document.getElementById('gList').innerHTML=[...data.glucose].sort((a,b)=>b.ts-a.ts).map(o=>{const orig=data.glucose.findIndex(x=>x.ts===o.ts);return `<div class="item"><div><b>${o.v} mg/dL</b> <span class="badge">${o.moment}</span><br><small>${o.date}</small></div><div class="row"><button class="btn btn-sm btn-ghost" onclick="editItem('glucose',${orig})">Modif</button><button class="btn btn-sm btn-danger" onclick="delItem('glucose',${orig})">Suppr</button></div></div>`}).join('')||'<small>Aucune</small>';
 document.getElementById('fList').innerHTML=data.foods.map((o,i)=>`<div class="item"><div><b>${o.title}</b> <span class="badge">${o.type}</span></div><div class="row"><button class="btn btn-sm btn-ghost" onclick="editItem('foods',${i})">Modif</button><button class="btn btn-sm btn-danger" onclick="delItem('foods',${i})">Suppr</button></div></div>`).join('')||'<small>Aucune recette - clique ♻️ Restaurer recettes en haut</small>';

function drawChart(){const c=document.getElementById('gChart');if(!c)return;const ctx=c.getContext('2d');const W=c.width=c.clientWidth*2;const H=c.height=320;ctx.clearRect(0,0,W,H);const vals=[...data.glucose].sort((a,b)=>a.ts-b.ts).slice(-20);if(vals.length<2){ctx.fillStyle='#999';ctx.font='22px sans-serif';ctx.fillText('Ajoute 2 glycémies',20,160);return;}const min=Math.min(...vals.map(o=>o.v),70)-10,max=Math.max(...vals.map(o=>o.v),180)+10;ctx.strokeStyle='#eee';for(let y=0;y<=4;y++){const yy=20+y*(H-40)/4;ctx.beginPath();ctx.moveTo(60,yy);ctx.lineTo(W-20,yy);ctx.stroke();}ctx.strokeStyle='#6c5ce7';ctx.lineWidth=4;ctx.beginPath();vals.forEach((o,i)=>{const x=60+i*(W-80)/(vals.length-1||1);const y=20+(1-(o.v-min)/(max-min||1))*(H-40);if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);});ctx.stroke();}
