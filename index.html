<head><style>
@font-face {

  font-display: swap;

}

}

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17191d">
<title>Mon carnet de bord</title>
<style>
:root{--bg:#17191d;--panel:#23262c;--panel2:#2b2f36;--text:#f2f3f5;--muted:#b7bdc8;--line:#414753;--accent:#5aa9ff;--accent2:#f2b84b;--danger:#ff6b6b;--radius:18px}
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.45}
header{position:sticky;top:0;z-index:10;background:rgba(23,25,29,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 16px}
h1{font-size:22px;margin:0;font-weight:800}
main{max-width:820px;margin:auto;padding:14px 14px 100px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px}
.section{margin:12px 0;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--panel)}
.section button.section-head{width:100%;border:0;background:var(--panel);color:var(--text);display:flex;align-items:center;justify-content:space-between;padding:16px;font-size:18px;font-weight:800;text-align:left}
.section-body{display:none;padding:0 14px 14px} .section.open .section-body{display:block}
.action{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:12px;padding:10px 13px;font-weight:700}
.action.primary{background:var(--accent);color:#07111d;border-color:transparent}
.action.danger{background:transparent;color:#ff9b9b;border-color:#7c3a3a}
form.entry{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 14px} form.entry .full{grid-column:1/-1}
label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
input,select,textarea{width:100%;padding:11px 12px;background:#111317;color:var(--text);border:1px solid var(--line);border-radius:11px}
textarea{min-height:72px;resize:vertical}
.list{display:flex;flex-direction:column;gap:8px} .item{background:#1d2025;border:1px solid #383e49;border-radius:13px;padding:11px 12px}
.item-title{font-weight:800} .item-meta{font-size:12px;color:var(--muted);margin-top:2px} .item-text{margin-top:7px;white-space:pre-wrap}
.empty{color:var(--muted);font-size:14px;padding:8px 0}
</style>
</head>
<body>
<header><h1>Mon carnet de bord</h1></header>
<main>
<div class="card"><b id="count">0</b> recettes - Version legere qui s'ouvre partout</div>
<div class="section open">
<button class="section-head" type="button" onclick="this.parentElement.classList.toggle('open')"><span>Alimentation et recettes</span><span>›</span></button>
<div class="section-body">
<div style="display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px">
<button class="action primary" onclick="document.getElementById('foodForm').style.display='grid'">+ Ajouter une recette</button>
<button class="action" onclick="if(confirm('Remettre les 14 recettes de base ?')){localStorage.removeItem(KEY); location.reload();}">Remettre les 14 de base</button>
</div>
<form class="entry" id="foodForm" onsubmit="addFood(event)" style="display:none">
<div><label>Type</label><select id="foodType"><option>Recette TM7</option><option>Recette</option><option>Repas</option></select></div>
<div><label>Titre</label><input id="foodTitle" required></div>
<div><label>Date</label><input id="foodDate" type="date" required></div>
<div class="full"><label>Ingredients</label><textarea id="foodIngredients"></textarea></div>
<div class="full"><label>Etapes</label><textarea id="foodSteps"></textarea></div>
<div class="full"><button class="action primary" type="submit">Enregistrer</button> <button class="action" type="button" onclick="this.closest('form').style.display='none'">Annuler</button></div>
</form>
<div class="list" id="foodList"></div>
</div>
</div>
</main>

function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){
      const parsed=JSON.parse(raw);
      if(Array.isArray(parsed) && parsed.length>0) return parsed;
      if(parsed.foods && Array.isArray(parsed.foods)) return parsed.foods;
    }
  }catch(e){}
  return JSON.parse(JSON.stringify(BUILTIN_RECIPES));
}
function save(foods){
  try{
    localStorage.setItem(KEY, JSON.stringify(foods));
    return true;
  }catch(e){
    alert('Stockage plein: '+e.message);
    return false;
  }
}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
let foods = load();
function render(){
  document.getElementById('count').textContent=foods.length;
  const list=document.getElementById('foodList');
  if(!foods.length){ list.innerHTML='<div class="empty">Aucune recette</div>'; return; }
  list.innerHTML=foods.map((x,i)=>`
    <div class="item">
      <div style="display:flex;justify-content:space-between;gap:8px">
        <div><div class="item-title">${esc(x.title)}</div><div class="item-meta">${esc(x.date)} • ${esc(x.type)} ${x.duration?'• '+esc(x.duration):''}</div></div>
        <button class="action danger" style="padding:5px 8px" onclick="delFood(${i})">Suppr</button>
      </div>
      ${x.ingredients?`<div class="item-text"><b>Ingrédients:</b><br>${esc(x.ingredients)}</div>`:''}
      ${x.steps?`<div class="item-text"><b>Étapes:</b><br>${esc(x.steps)}</div>`:''}
    </div>`).join('');
}
function addFood(e){
  e.preventDefault();
  const entry={
    title:document.getElementById('foodTitle').value.trim(),
    type:document.getElementById('foodType').value,
    date:document.getElementById('foodDate').value,
    ingredients:document.getElementById('foodIngredients').value.trim(),
    steps:document.getElementById('foodSteps').value.trim()
  };
  if(!entry.title) return;
  foods.unshift(entry);
  if(save(foods)){
    e.target.reset();
    e.target.style.display='none';
    render();
  }else{ foods.shift(); }
}
function delFood(i){
  if(!confirm('Supprimer cette recette ?')) return;
  foods.splice(i,1);
  save(foods);
  render();
}
(function(){
  const d=document.getElementById('foodDate');
  if(d) d.valueAsDate=new Date();
  render();
