<!DOCTYPE html>
<html lang="fr">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Carnet Mounir simple qui marche</title>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial;background:#f6f7fb;color:#2d3436}
header{padding:10px 16px;background:#fff;position:sticky;top:0;z-index:10;box-shadow:0 2px 8px rgba(0,0,0,.06);display:flex;justify-content:space-between;align-items:center}
h1{font-size:17px;margin:0}
.btn{border:0;border-radius:10px;padding:10px 14px;background:#0ea5e9;color:#fff;font-weight:700;cursor:pointer}
.btn-sm{padding:6px 10px;font-size:11px}
.btn-ghost{background:#eee;color:#333}
.card{background:#fff;margin:10px;border-radius:14px;padding:12px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.row{display:flex;gap:8px;flex-wrap:wrap}
input,select{width:100%;padding:10px;border-radius:10px;border:1px solid #ddd;font-size:14px;box-sizing:border-box}
label{font-size:11px;font-weight:600;margin:5px 0 2px;display:block;color:#64748b}
.item{border:1px solid #e5e7eb;border-radius:12px;padding:10px;margin:8px 0;background:#fff;display:flex;gap:10px;align-items:center}
img.thumb{width:80px;height:60px;object-fit:cover;border-radius:8px;border:2px solid #0ea5e9;cursor:pointer}
.badge{background:#eef2ff;padding:2px 7px;border-radius:20px;font-size:10px}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#2d3436;color:#fff;padding:10px 14px;border-radius:20px;display:none;z-index:99}
#imgModal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.88);z-index:100;justify-content:center;align-items:center;flex-direction:column;padding:20px;box-sizing:border-box}
#imgModal img{max-width:95%;max-height:70%;border-radius:12px}
.user-badge{background:#e0f2fe;border:1px solid #bae6fd;color:#0369a1;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700}
.shortcut-btn{background:linear-gradient(135deg,#6c5ce7,#0ea5e9);color:#fff;border-radius:12px;padding:10px 14px;font-weight:700;font-size:13px;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.preview-box{margin-top:6px;padding:6px;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;display:none}
.preview-box.has-photo{display:block}
</style>
</head>
<body>
<header><h1>📒 Carnet <span class="user-badge">Mounir</span></h1><button class="btn btn-sm btn-ghost" onclick="exportData()">⬇️</button></header>
<div id="toast"></div>
<div id="imgModal" onclick="this.style.display='none'"><img id="modalImg"></div>
<main style="max-width:720px;margin:auto;padding-bottom:80px">

<div class="card">
<h3 style="margin:0 0 8px">🩸 Glycémie - version qui enregistre</h3>
<div style="margin:8px 0"><a href="shortcuts://run-shortcut?name=Test%20glyc%C3%A9mie%20photo" class="shortcut-btn">📸 Test glycémie photo</a></div>
<div class="row"><div style="flex:1"><label>Valeur *</label><input id="gVal" type="number" inputmode="numeric" placeholder="110"></div><div style="flex:1"><label>Moment</label><select id="gMoment"><option value="à jeun">À jeun</option><option value="avant repas">Avant repas</option><option value="après repas">2h après repas</option><option value="coucher">Coucher</option></select></div></div>
<div class="row"><div style="flex:1"><label>Date</label><input id="gDate" type="date"></div><div style="flex:1"><label>Heure</label><input id="gTime" type="time"></div></div>
<label>Photo (optionnelle mais récupérable)</label><input id="gPhoto" type="file" accept="image/*">
<div id="gPreview" class="preview-box"></div>
<div class="row" style="margin-top:8px"><button class="btn" onclick="saveGly()">💾 Enregistrer glycémie</button><button class="btn btn-ghost" onclick="clearPhoto('g')">❌ Effacer photo</button></div>
<div id="gList" style="margin-top:12px"></div>
</div>

<div class="card">
<h3 style="margin:0 0 8px">❤️ Tension - photos récupérables</h3>
<div class="row"><div style="flex:1"><label>Valeur *</label><input id="tVal" placeholder="120/80 72"></div><div style="flex:1"><label>Date</label><input id="tDate" type="date"></div></div>
<label>Photo tensiomètre</label><input id="tPhoto" type="file" accept="image/*">
<div id="tPreview" class="preview-box"></div>
<div class="row" style="margin-top:8px"><button class="btn" style="background:#0ea5e9" onclick="saveTension()">Enregistrer tension + photo</button></div>
<div id="tList" style="margin-top:12px"></div>
</div>

<div class="card">
<h3 style="margin:0 0 8px">🏃 Sport</h3>
<div class="row"><div style="flex:2"><input id="sVal" placeholder="Marche 30min"></div><div style="flex:1"><input id="sDate" type="date"></div></div>
<div class="row" style="margin-top:8px"><button class="btn" onclick="saveSport()">Enregistrer sport</button></div>
<div id="sList" style="margin-top:12px"></div>
</div>

</main>
<script>
// CLE UNIQUE MOUNIR - comme avant qui marchait
const KEY='carnet_v12_final_MOUNIR';
let data=JSON.parse(localStorage.getItem(KEY)||'null');
if(!data) data={glucose:[],tension:[],sport:[]};
if(!data.tension) data.tension=[];
if(!data.sport) data.sport=[];
let photos={g:null,t:null};

function saveAll(){localStorage.setItem(KEY,JSON.stringify(data));render();console.log('SAVE OK',KEY,data.glucose.length);}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.style.display='block';setTimeout(()=>el.style.display='none',3000);}
function todayStr(){return new Date().toISOString().slice(0,10);}function nowStr(){return new Date().toTimeString().slice(0,5);}
document.getElementById('gDate').value=todayStr();document.getElementById('tDate').value=todayStr();document.getElementById('sDate').value=todayStr();
document.getElementById('gTime').value=nowStr();

function compress(file,cb){
 const r=new FileReader();
 r.onload=e=>{
  const img=new Image();
  img.onload=()=>{
   let w=img.width,h=img.height;const max=700;
   if(w>max||h>max){const s=Math.min(max/w,max/h);w*=s;h*=s;}
   const c=document.createElement('canvas');c.width=w;c.height=h;
   c.getContext('2d').drawImage(img,0,0,w,h);
   cb(c.toDataURL('image/jpeg',0.6));
  };
  img.onerror=()=>cb(e.target.result);
  img.src=e.target.result;
 };
 r.readAsDataURL(file);
}
document.getElementById('gPhoto').addEventListener('change',e=>{
 const f=e.target.files[0];if(!f)return;
 compress(f,url=>{
  photos.g=url;
  const b=document.getElementById('gPreview');b.classList.add('has-photo');
  b.innerHTML=`<img src="${url}" style="width:80px;height:60px;object-fit:cover;border-radius:6px"> <small style="color:#059669">✓ ${Math.round(url.length/1024)}Ko - récupérable</small>`;
  toast('Photo prête');
 });
});
document.getElementById('tPhoto').addEventListener('change',e=>{
 const f=e.target.files[0];if(!f)return;
 compress(f,url=>{
  photos.t=url;
  const b=document.getElementById('tPreview');b.classList.add('has-photo');
  b.innerHTML=`<img src="${url}" style="width:80px;height:60px;object-fit:cover;border-radius:6px"> <small>✓ ${Math.round(url.length/1024)}Ko</small>`;
 });
});
function clearPhoto(k){
 photos[k]=null;
 const b=document.getElementById(k+'Preview');
 if(b){b.classList.remove('has-photo');b.innerHTML='';}
 document.getElementById(k+'Photo').value='';
}
function showImg(src){
 if(!src) return;
 document.getElementById('modalImg').src=src;
 document.getElementById('imgModal').style.display='flex';
}

// FONCTION QUI ENREGISTRE VRAIMENT - ultra simple comme avant
function saveGly(){
 const vEl=document.getElementById('gVal');
 let v=parseInt(vEl.value);
 if(!v){toast('Entre valeur glycémie');vEl.focus();return;}
 const o={
  v:v,
  moment:document.getElementById('gMoment').value,
  date:document.getElementById('gDate').value||todayStr(),
  time:document.getElementById('gTime').value||nowStr(),
  photo:photos.g,
  ts:Date.now()
 };
 data.glucose.push(o);
 vEl.value='';
 clearPhoto('g');
 saveAll();
 toast(`✅ Glycémie ${v} enregistrée ${o.photo?'avec photo récupérable':''} - total ${data.glucose.length}`);
}
function saveTension(){
 const v=document.getElementById('tVal').value.trim();
 if(!v){toast('Entre tension');return;}
 const o={v:v,date:document.getElementById('tDate').value||todayStr(),photo:photos.t,ts:Date.now()};
 data.tension.push(o);
 document.getElementById('tVal').value='';
 clearPhoto('t');
 saveAll();
 toast(`✅ Tension ${v} enregistrée ${o.photo?'avec photo':''}`);
}
function saveSport(){
 const v=document.getElementById('sVal').value.trim();
 if(!v){toast('Activité ?');return;}
 const o={v:v,date:document.getElementById('sDate').value||todayStr(),ts:Date.now()};
 data.sport.push(o);
 document.getElementById('sVal').value='';
 saveAll();
 toast('Sport enregistré');
}
function delItem(cat,i){
 if(!confirm('Supprimer ?')) return;
 data[cat].splice(i,1);
 saveAll();
}
function exportData(){
 const blob=new Blob([JSON.stringify(data)],{type:'application/json'});
 const a=document.createElement('a');
 a.href=URL.createObjectURL(blob);
 a.download='carnet_MOUNIR_'+todayStr()+'.json';
 a.click();
}
function render(){
 document.getElementById('gList').innerHTML=data.glucose.slice().reverse().map((o,idx)=>{
  const realIdx=data.glucose.length-1-idx;
  return `<div class="item"><div style="flex:1;display:flex;gap:8px;align-items:center">${o.photo?`<img src="${o.photo}" class="thumb" onclick="showImg('${o.photo.replace(/'/g,'')}')">`:`<div style="width:80px;height:60px;background:#f1f5f9;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:10px">—</div>`}<div><b>${o.v} mg/dL</b> <span class="badge">${o.moment}</span><br><small>${o.date} ${o.time||''}</small><br>${o.photo?`<small style="color:#059669">✅ Photo ${Math.round(o.photo.length/1024)}Ko - tap pour voir/récupérer</small>`:''}</div></div><button class="btn btn-sm btn-ghost" onclick="delItem('glucose',${realIdx})">Suppr</button></div>`;
 }).join('')||'<small style="color:#94a3b8">Aucune glycémie - entre 110 puis Enregistrer, ça doit s\'ajouter ici</small>';
 document.getElementById('tList').innerHTML=data.tension.slice().reverse().map((o,idx)=>{
  const realIdx=data.tension.length-1-idx;
  return `<div class="item"><div style="flex:1;display:flex;gap:8px;align-items:center">${o.photo?`<img src="${o.photo}" class="thumb" onclick="showImg('${o.photo.replace(/'/g,'')}')">`:`<div style="width:80px;height:60px;background:#f1f5f9;border-radius:8px;display:flex;align-items:center;justify-content:center">—</div>`}<div><b>${o.v}</b><br><small>${o.date}</small><br>${o.photo?`<small style="color:#059669">✅ Photo récupérable - tap pour voir</small>`:''}</div></div><button class="btn btn-sm btn-ghost" onclick="delItem('tension',${realIdx})">Suppr</button></div>`;
 }).join('')||'<small style="color:#94a3b8">Aucune tension</small>';
 document.getElementById('sList').innerHTML=data.sport.slice().reverse().map((o,idx)=>{
  const realIdx=data.sport.length-1-idx;
  return `<div class="item"><div style="flex:1"><b>🏃 ${o.v}</b><br><small>${o.date}</small></div><button class="btn btn-sm btn-ghost" onclick="delItem('sport',${realIdx})">Suppr</button></div>`;
 }).join('')||'<small style="color:#94a3b8">Aucun sport</small>';
}

// Gestion ?glycemie= depuis raccourci - ENREGISTRE DIRECT comme l'ancien qui marchait
function handleQuery(){
 const p=new URLSearchParams(location.search);
 const gv=p.get('glycemie')||p.get('value');
 if(gv){
  const v=parseInt(gv.replace(/\D/g,''));
  if(v){
   document.getElementById('gVal').value=v;
   setTimeout(()=>{
    saveGly();
    history.replaceState({},'',location.pathname);
    toast(`✅ Glycémie ${v} depuis raccourci enregistrée`);
   },500);
  }
 }
}
window.addEventListener('load',()=>{render();handleQuery();});
</script>
<script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body>
</html>
