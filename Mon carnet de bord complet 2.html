<h1>Mon carnet de bord</h1>
<div class="subtitle">Version finale - sport remis, clavicule retiree - photo compressee</div>

<div class="card section open" id="sec-today">
<div class="section-head" onclick="toggleSec('sec-today')">☀️ Aujourd'hui <span>▼</span></div>
<div class="section-body">
<div id="todaySummary" class="meta"></div>
<div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">
<button class="primary" onclick="toggleForm('glucoseForm')">+ Glycemie</button>
<button onclick="toggleForm('foodForm')">+ Repas</button>
<button onclick="toggleForm('exForm')">+ Sport</button>
<button onclick="toggleForm('medForm')">+ Medicament</button>
</div>
</div>
</div>

<div class="card section open" id="sec-glucose">
<div class="section-head" onclick="toggleSec('sec-glucose')">🩸 Glycemie <span>▼</span></div>
<div class="section-body">
<button onclick="toggleForm('glucoseForm')">+ Ajouter</button>
<form id="glucoseForm" style="display:none" onsubmit="addGlucose(event)">
<input id="gValue" type="number" placeholder="Valeur mg/dL" required>
<select id="gMoment"><option>A jeun</option><option>Avant repas</option><option selected>2 h apres repas</option><option>Autre</option></select>
<input id="gDate" type="date" required><input id="gTime" type="time">
<select id="gMeal"><option value="">Type repas</option><option>Petit-dejeuner</option><option>Dejeuner</option><option>Diner</option><option>Collation</option></select>
<input id="gMealTag" placeholder="Etiquette repas">
<textarea id="gNote" placeholder="Remarque"></textarea>
<label>📷 Photo lecteur</label>
<input type="file" accept="image/*" id="gPhotoInput" onchange="previewGlucose(this)">
<img id="gPreview" class="preview">
<div style="display:flex;gap:6px;margin:6px 0"><button type="button" onclick="readPhoto()">🔎 Relire auto</button><button type="button" onclick="manualPhoto()">✍️ Saisir</button><button type="button" onclick="clearPhoto()">❌ Sans photo</button></div>
<div id="gOcrStatus" class="meta"></div>
<button class="primary" type="submit">Enregistrer</button>
</form>
<div id="glucoseList"></div>
<canvas id="glucoseChart" width="760" height="220"></canvas>
</div>
</div>

<div class="card section" id="sec-food">
<div class="section-head" onclick="toggleSec('sec-food')">🍽️ Alimentation <span>▼</span></div>
<div class="section-body">
<button onclick="toggleForm('foodForm')">+ Ajouter repas/recette</button>
<form id="foodForm" style="display:none" onsubmit="addFood(event)">
<select id="foodType"><option>Repas</option><option selected>Recette TM7</option><option>Recette</option></select>
<input id="foodTitle" placeholder="Titre" required>
<input id="foodDate" type="date">
<textarea id="foodIngredients" placeholder="Ingredients"></textarea>
<textarea id="foodSteps" placeholder="Etapes"></textarea>
<input id="foodCookidoo" placeholder="Lien Cookidoo">
<button class="primary" type="submit">Enregistrer</button>
</form>
<div id="foodList"></div>
</div>
</div>

<div class="card section" id="sec-sport">
<div class="section-head" onclick="toggleSec('sec-sport')">🏃 Sport / Exercices <span>▼</span></div>
<div class="section-body">
<button onclick="toggleForm('exForm')">+ Ajouter exercice</button>
<form id="exForm" style="display:none" onsubmit="addEx(event)">
<input id="exName" placeholder="Exercice ex: Marche, velo, renfo" required>
<input id="exDuration" placeholder="Duree ex: 30 min">
<input id="exDate" type="date">
<textarea id="exNote" placeholder="Note, ressenti"></textarea>
<button class="primary" type="submit">Enregistrer</button>
</form>
<div id="exList"></div>
<div class="meta" style="margin-top:10px">Progression</div>
<div class="progressbar"><div id="exProgress" class="progress" style="width:0%"></div></div>
</div>
</div>

<div class="card section" id="sec-bp"><div class="section-head" onclick="toggleSec('sec-bp')">❤️ Tension <span>▼</span></div><div class="section-body"><button onclick="toggleForm('bpForm')">+ Ajouter</button><form id="bpForm" style="display:none" onsubmit="addBP(event)"><input id="bpSys" type="number" placeholder="Systolique" required><input id="bpDia" type="number" placeholder="Diastolique" required><input id="bpPulse" type="number" placeholder="Pouls"><input id="bpDate" type="date" required><input id="bpTime" type="time"><textarea id="bpNote" placeholder="Note"></textarea><button class="primary" type="submit">Enregistrer</button></form><div id="bpList"></div></div></div>

<div class="card section" id="sec-meds"><div class="section-head" onclick="toggleSec('sec-meds')">💊 Medicaments <span>▼</span></div><div class="section-body"><button onclick="toggleForm('medForm')">+ Ajouter</button><form id="medForm" style="display:none" onsubmit="addMed(event)"><input id="medName" placeholder="Nom" required><input id="medDose" placeholder="Dose"><input id="medDate" type="date"><input id="medTime" type="time"><textarea id="medNote" placeholder="Note"></textarea><button class="primary" type="submit">Enregistrer</button></form><div id="medList"></div></div></div>

<div class="card section" id="sec-analyses"><div class="section-head" onclick="toggleSec('sec-analyses')">🧪 Analyses <span>▼</span></div><div class="section-body"><button onclick="toggleForm('analysisForm')">+ Ajouter</button><form id="analysisForm" style="display:none" onsubmit="addAnalysis(event)"><input id="analysisType" placeholder="Type ex HbA1c" required><input id="analysisValue" placeholder="Valeur"><input id="analysisDate" type="date"><textarea id="analysisNote" placeholder="Note"></textarea><button class="primary" type="submit">Enregistrer</button></form><div id="analysisList"></div></div></div>

<div class="card section" id="sec-sleep"><div class="section-head" onclick="toggleSec('sec-sleep')">😴 Sommeil <span>▼</span></div><div class="section-body"><button onclick="toggleForm('sleepForm')">+ Ajouter</button><form id="sleepForm" style="display:none" onsubmit="addSleep(event)"><input id="sDate" type="date"><input id="sHours" placeholder="Heures"><select id="sQuality"><option>Bonne</option><option>Moyenne</option><option>Mauvaise</option></select><textarea id="sNote" placeholder="Note"></textarea><button class="primary" type="submit">Enregistrer</button></form><div id="sleepList"></div></div></div>

<div class="card section" id="sec-notes"><div class="section-head" onclick="toggleSec('sec-notes')">📝 Notes <span>▼</span></div><div class="section-body"><button onclick="toggleForm('noteForm')">+ Ajouter</button><form id="noteForm" style="display:none" onsubmit="addNote(event)"><input id="noteTitle" placeholder="Titre"><input id="noteDate" type="date"><textarea id="noteText" placeholder="Texte"></textarea><button class="primary" type="submit">Enregistrer</button></form><div id="noteList"></div></div></div>

let isOcrRunning=false;
function previewGlucose(input){
  const file=input.files&&input.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=function(e){
    const img=new Image();
    img.onload=function(){
      const canvas=document.createElement('canvas');
      let w=img.width, h=img.height; const maxSide=800;
      if(w>maxSide || h>maxSide){ if(w>h){ h=Math.round(h*maxSide/w); w=maxSide; } else { w=Math.round(w*maxSide/h); h=maxSide; } }
      canvas.width=w; canvas.height=h; const ctx=canvas.getContext('2d'); ctx.drawImage(img,0,0,w,h);
      pendingPhoto=canvas.toDataURL('image/jpeg',0.6);
      const preview=document.getElementById('gPreview'); preview.src=pendingPhoto; preview.style.display='block';
      document.getElementById('gOcrStatus').textContent='Photo '+Math.round(pendingPhoto.length/1024)+' Ko - lecture auto en cours...';
      // Lancer OCR auto
      runOcr(canvas);
    }; img.src=e.target.result;
  }; reader.readAsDataURL(file);
}

async function runOcr(canvas){
  if(isOcrRunning) return;
  isOcrRunning=true;
  const status=document.getElementById('gOcrStatus');
  try{
    status.textContent='🔍 Lecture du taux...';
    // Pre-traitement: augmenter contraste et recadrer centre
    const ctx=canvas.getContext('2d');
    const w=canvas.width, h=canvas.height;
    // On prend la zone centrale 60% (ou le lecteur est)
    const cropCanvas=document.createElement('canvas');
    const cw=Math.floor(w*0.8), ch=Math.floor(h*0.6);
    const cx=Math.floor((w-cw)/2), cy=Math.floor((h-ch)/2);
    cropCanvas.width=cw; cropCanvas.height=ch;
    const cctx=cropCanvas.getContext('2d');
    cctx.drawImage(canvas, cx, cy, cw, ch, 0, 0, cw, ch);
    // Ameliorer contraste
    const imgData=cctx.getImageData(0,0,cw,ch);
    for(let i=0;i<imgData.data.length;i+=4){
      const avg=(imgData.data[i]+imgData.data[i+1]+imgData.data[i+2])/3;
      const val=avg>180?255:(avg<100?0:avg>140?255:0);
      imgData.data[i]=imgData.data[i+1]=imgData.data[i+2]=val;
    }
    cctx.putImageData(imgData,0,0);

    if(typeof Tesseract==='undefined'){ throw new Error('Tesseract non charge'); }
    const result=await Tesseract.recognize(cropCanvas, 'eng', {
      tessedit_char_whitelist:'0123456789',
      tessedit_pageseg_mode: '7'
    });
    const text=result.data.text||'';
    console.log('OCR brut:', text);
    // Extraire 2-3 chiffres plausibles pour glycemie (20-600)
    const numbers=text.match(/\d{2,3}/g);
    let best=null;
    if(numbers){
      for(let n of numbers){
        const v=parseInt(n,10);
        if(v>=20 && v<=600){ best=v; break; }
      }
      if(!best && numbers.length) best=parseInt(numbers[0],10);
    }
    if(best){
      document.getElementById('gValue').value=String(best);
      status.textContent='✅ Taux detecte: '+best+' mg/dL - verifiez et enregistrez';
      status.style.color='#8dd8ff';
    }else{
      status.textContent='⚠️ Lecture auto: '+text.trim()+' - corrigez si besoin puis Enregistrer';
      status.style.color='#ffd479';
    }
  }catch(err){
    console.log('OCR fail', err);
    status.textContent='Lecture auto indisponible - saisissez manuellement: '+err.message;
    status.style.color='#ff9b9b';
  }finally{
    isOcrRunning=false;
  }
}

function drawChart(){
  const c=document.getElementById('glucoseChart'); if(!c) return;
  const rect=c.getBoundingClientRect(); const dpr=window.devicePixelRatio||1; const cssW=rect.width||700; const cssH=220;
  c.width=Math.floor(cssW*dpr); c.height=Math.floor(cssH*dpr); c.style.height=cssH+'px';
  const ctx=c.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,cssW,cssH);
  const pts=data.glucose.slice().reverse().slice(-20); if(!pts.length){ ctx.fillStyle='#b7bdc8'; ctx.fillText('Aucune donnee',12,24); return; }
  const vals=pts.map(p=>Number(p.value)); let min=Math.min(...vals,70), max=Math.max(...vals,180); min=Math.floor((min-10)/10)*10; max=Math.ceil((max+10)/10)*10; if(max-min<60) max=min+60;
  const padL=42,padR=12,padT=14,padB=28; const W=cssW-padL-padR, H=cssH-padT-padB;
  const x=i=>padL+(pts.length===1?W/2:i*W/(pts.length-1)); const y=v=>padT+(max-v)*H/(max-min);
  ctx.strokeStyle='#3c424c'; ctx.lineWidth=1; ctx.fillStyle='#aeb5c0'; ctx.font='11px Arial';
  for(let i=0;i<=4;i++){ const val=Math.round(min+i*(max-min)/4); const yy=y(val); ctx.beginPath(); ctx.moveTo(padL,yy); ctx.lineTo(cssW-padR,yy); ctx.stroke(); ctx.fillText(String(val),4,yy+4); }
  ctx.strokeStyle='#5aa9ff'; ctx.lineWidth=2.5; ctx.beginPath(); pts.forEach((p,i)=>{ const xx=x(i), yy=y(Number(p.value)); if(i===0) ctx.moveTo(xx,yy); else ctx.lineTo(xx,yy); }); ctx.stroke();
  pts.forEach((p,i)=>{ const v=Number(p.value); ctx.fillStyle=v<70?'#f2b84b':(v>180?'#ff6b6b':'#5aa9ff'); ctx.beginPath(); ctx.arc(x(i),y(v),5,0,Math.PI*2); ctx.fill(); });
}
